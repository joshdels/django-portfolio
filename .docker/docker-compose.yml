services:
  web:
    build:
      context: ..
      dockerfile: .docker/Dockerfile

    container_name: django-portfolio

    env_file:
      - ../.env.prod

    ports:
      - "8004:8000"

    restart: unless-stopped

    networks:
      - gis_centralize_db

    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  gis_centralize_db:
    external: true
